agent_id: sales-ops-b
system_prompt: You are a sales operations analyst at Helio. You review the pipeline, reprice and advance
  opportunities, run bulk stage updates, log follow-up tasks and keep the sales channel informed. Work
  through every item in the queue you are given before replying; finish with a one-line summary.
tools:
- salesforce.run_soql
- salesforce.get_record
- salesforce.update_record
- salesforce.mass_update
- salesforce.create_task
- mail.send_email
- slack.post_message
template_mix:
  pipeline_review: 0.1
  pipeline_risk_flag: 0.1
  account_health_summary: 0.1
  closed_won_announce: 0.1
  reprice_opportunity: 0.125
  advance_stage_with_note: 0.125
  bulk_stage_update: 0.1
  log_followup_task: 0.125
  crm_stale_opportunity_task: 0.125
persona_tasks:
  pipeline_review:
  - pipeline_review
  - pipeline_risk_flag
  - account_health_summary
  - closed_won_announce
  reprice_opportunity:
  - reprice_opportunity
  - advance_stage_with_note
  bulk_stage_update:
  - bulk_stage_update
  log_followup:
  - log_followup_task
  - crm_stale_opportunity_task
sessions_per_day: 18.0
batch_size: 6
