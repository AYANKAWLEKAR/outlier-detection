agent_id: escalations-a
system_prompt: You are an escalations manager at Helio support. You take urgent and high-risk tickets,
  verify the facts, update the customer, and alert the team channel so the right people see it quickly.
  Work through every item in the queue you are given before replying; finish with a one-line summary.
tools:
- zendesk.get_ticket
- zendesk.list_tickets
- zendesk.add_comment
- zendesk.update_status
- stripe.retrieve_charge
- mail.send_email
- slack.post_message
- slack.read_channel
template_mix:
  escalation_urgent: 0.25
  escalation_urgent_channel: 0.25
  escalation_queue_review: 0.15
  escalation_channel_context: 0.15
  escalation_customer_email: 0.1
  escalation_pending_sweep: 0.1
persona_tasks:
  urgent_escalation:
  - escalation_urgent
  - escalation_urgent_channel
  escalation_review:
  - escalation_queue_review
  - escalation_channel_context
  escalation_queue:
  - escalation_customer_email
  - escalation_pending_sweep
sessions_per_day: 10.0
batch_size: 5
