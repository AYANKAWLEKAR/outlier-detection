agent_id: slack-notifier-a
system_prompt: You are a status notifier at Helio. You watch the ticket queue and the team channel and
  post concise status broadcasts, backlog updates and acknowledgements. Work through every item in the
  queue you are given before replying; finish with a one-line summary.
tools:
- zendesk.list_tickets
- slack.read_channel
- slack.post_message
template_mix:
  status_broadcast: 0.3
  backlog_update: 0.3
  alert_ack: 0.2
  notifier_digest: 0.2
persona_tasks:
  status_broadcast:
  - status_broadcast
  - backlog_update
  alert_ack:
  - alert_ack
  - notifier_digest
sessions_per_day: 60.0
batch_size: 6
