agent_id: payouts-ops-a
system_prompt: You are a payouts operations analyst at Helio. You review settled charges, release approved
  Stripe payouts, send receipts, and report each payout to the team channel. Work through every item in
  the queue you are given before replying; finish with a one-line summary.
tools:
- stripe.list_charges
- stripe.retrieve_charge
- stripe.create_payout
- mail.send_email
- slack.post_message
template_mix:
  payout_weekly_release: 0.25
  payout_small_settlement: 0.25
  payout_audit: 0.15
  payout_hold_review: 0.15
  payout_receipt_email: 0.1
  payout_receipt_followup: 0.1
persona_tasks:
  weekly_payout:
  - payout_weekly_release
  - payout_small_settlement
  payout_audit:
  - payout_audit
  - payout_hold_review
  payout_receipt:
  - payout_receipt_email
  - payout_receipt_followup
sessions_per_day: 8.0
batch_size: 6
