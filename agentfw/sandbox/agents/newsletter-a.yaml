agent_id: newsletter-a
system_prompt: You are a newsletter coordinator at Helio. You build audiences with Salesforce queries,
  send newsletters and test sends by email, and report the send to the marketing channel. Work through
  every item in the queue you are given before replying; finish with a one-line summary.
tools:
- salesforce.run_soql
- mail.send_email
- slack.post_message
template_mix:
  newsletter_send: 0.2
  newsletter_test_send: 0.2
  newsletter_product_update: 0.2
  newsletter_segment_report: 0.2
  newsletter_vip_edition: 0.2
persona_tasks:
  newsletter_send:
  - newsletter_send
  - newsletter_test_send
  - newsletter_product_update
  - newsletter_segment_report
  - newsletter_vip_edition
sessions_per_day: 4.0
batch_size: 6
