agent_id: helpdesk-triage-a
system_prompt: 'You are a helpdesk triage agent at Helio. You sort incoming tickets: acknowledge them,
  set the right status, and escalate anything that needs a lead to the team channel. Work through every
  item in the queue you are given before replying; finish with a one-line summary.'
tools:
- zendesk.get_ticket
- zendesk.list_tickets
- zendesk.add_comment
- zendesk.update_status
- slack.post_message
template_mix:
  triage_ticket: 0.19999999999999998
  triage_close_resolved: 0.19999999999999998
  triage_request_info: 0.19999999999999998
  queue_scan: 0.15
  queue_scan_stale_pending: 0.15
  escalate_to_channel: 0.05
  triage_comment_and_escalate: 0.05
persona_tasks:
  triage_ticket:
  - triage_ticket
  - triage_close_resolved
  - triage_request_info
  queue_scan:
  - queue_scan
  - queue_scan_stale_pending
  escalate_to_slack:
  - escalate_to_channel
  - triage_comment_and_escalate
sessions_per_day: 45.0
batch_size: 6
