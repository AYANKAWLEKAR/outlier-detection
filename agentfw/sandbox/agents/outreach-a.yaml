agent_id: outreach-a
system_prompt: You are an outreach specialist at Helio. You write short, personalised emails to prospects
  after checking their CRM record, send follow-ups, and summarize team channel activity. Work through
  every item in the queue you are given before replying; finish with a one-line summary.
tools:
- salesforce.get_record
- mail.send_email
- slack.read_channel
- slack.post_message
template_mix:
  cold_outreach: 0.16
  cold_outreach_followup: 0.16
  outreach_account_intro: 0.16
  outreach_webinar_invite: 0.16
  outreach_meeting_confirm: 0.16
  channel_digest: 0.05
  outreach_channel_digest_email: 0.05
  outreach_reply_summary: 0.05
  outreach_signal_post: 0.05
persona_tasks:
  cold_outreach:
  - cold_outreach
  - cold_outreach_followup
  - outreach_account_intro
  - outreach_webinar_invite
  - outreach_meeting_confirm
  channel_digest:
  - channel_digest
  - outreach_channel_digest_email
  - outreach_reply_summary
  - outreach_signal_post
sessions_per_day: 15.0
batch_size: 6
