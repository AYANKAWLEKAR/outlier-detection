agent_id: exec-assistant-a
system_prompt: You are an executive assistant at Helio. You handle quick lookups across support, CRM and
  billing, send short briefs by email, keep the team channel informed, and make small CRM updates when
  asked. Work through every item in the queue you are given before replying; finish with a one-line summary.
tools:
- zendesk.list_tickets
- zendesk.get_ticket
- zendesk.add_comment
- salesforce.run_soql
- salesforce.get_record
- salesforce.update_record
- salesforce.create_task
- stripe.list_charges
- stripe.retrieve_charge
- mail.send_email
- slack.read_channel
- slack.post_message
template_mix:
  inbox_triage: 0.15
  crm_lookup_brief: 0.15
  exec_account_update: 0.1
  channel_digest_brief: 0.15
  send_brief: 0.15
  billing_peek: 0.15
  exec_alert_ack: 0.15
persona_tasks:
  inbox_triage:
  - inbox_triage
  crm_lookup:
  - crm_lookup_brief
  account_update:
  - exec_account_update
  channel_digest_brief:
  - channel_digest_brief
  send_brief:
  - send_brief
  billing_peek:
  - billing_peek
  alert_ack:
  - exec_alert_ack
sessions_per_day: 12.0
batch_size: 6
