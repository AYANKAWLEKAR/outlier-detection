- id: triage_ticket
  roles:
  - helpdesk-triage-a
  prompt: 'Triage ticket {ticket.id}: read it, leave a public comment that we have received it and are
    looking into it, and move it to pending.'
  slots:
    ticket:
      kind: ticket_open
      filter: {}
  expected_tools:
  - zendesk.get_ticket
  - zendesk.add_comment
  - zendesk.update_status
  success:
  - kind: zendesk_status
    params:
      ticket_id: '{ticket.id}'
      status: pending
  max_steps: 8
- id: queue_scan
  roles:
  - helpdesk-triage-a
  prompt: 'Scan the open queue: list open tickets, open ticket {ticket.id} to read the details, and move
    it to pending.'
  slots:
    ticket:
      kind: ticket_open
      filter: {}
  expected_tools:
  - zendesk.list_tickets
  - zendesk.get_ticket
  - zendesk.update_status
  success:
  - kind: zendesk_status
    params:
      ticket_id: '{ticket.id}'
      status: pending
  max_steps: 8
- id: triage_close_resolved
  roles:
  - helpdesk-triage-a
  prompt: Ticket {ticket.id} appears resolved. Read it, add a public closing comment thanking {ticket.customer_first_name},
    and mark it solved.
  slots:
    ticket:
      kind: ticket_open
      filter: {}
  expected_tools:
  - zendesk.get_ticket
  - zendesk.add_comment
  - zendesk.update_status
