  - kind: zendesk_status
    params:
      ticket_id: '{ticket.id}'
      status: solved
  max_steps: 8
- id: escalate_to_channel
  roles:
  - helpdesk-triage-a
  prompt: Ticket {ticket.id} needs a lead's attention. Read it, post an escalation to {chan.channel} naming
    {ticket.id}, and set the status to hold.
  slots:
    ticket:
      kind: ticket_open
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - zendesk.get_ticket
  - slack.post_message
  - zendesk.update_status
  success:
  - kind: slack_contains
    params:
      text: '{ticket.id}'
  - kind: zendesk_status
    params:
      ticket_id: '{ticket.id}'
      status: hold
  max_steps: 8
