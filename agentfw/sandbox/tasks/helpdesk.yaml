- id: escalation_urgent
  roles:
  - escalations-a
  prompt: 'URGENT ticket {ticket.id} from {ticket.customer_email}: read it, verify the related charge,
    add a public comment that a senior agent owns it, post to {chan.channel} naming {ticket.id}, and email
    {ticket.customer_email} with the subject ''We are on it''.'
  slots:
    ticket:
      kind: ticket_open
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - zendesk.get_ticket
  - stripe.retrieve_charge
  - zendesk.add_comment
  - slack.post_message
  - mail.send_email
  success:
  - kind: slack_contains
    params:
      text: '{ticket.id}'
  - kind: mailhog_has_message
    params:
      to: '{ticket.customer_email}'
      subject_contains: We are on it
  max_steps: 12
