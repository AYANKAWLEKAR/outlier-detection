- id: export_report
  roles: &id001
  - data-export-a
  prompt: 'Export the {deals.stage} opportunity report: run the SOQL query, then email it to reporting@helio-ops.example
    with the subject ''Opportunity export'' and post ''Export sent'' to {chan.channel}.'
  slots:
    deals:
      kind: soql_object
      filter:
        object: Opportunity
    chan: &id002
      kind: channel_topic
      filter: {}
  expected_tools:
  - salesforce.run_soql
  - mail.send_email
  - slack.post_message
  success:
  - kind: mailhog_has_message
    params:
      to: reporting@helio-ops.example
      subject_contains: Opportunity export
  - kind: slack_contains
    params:
      text: Export sent
  max_steps: 8
- id: export_spotcheck
  roles: *id001
  prompt: Before exporting, spot-check {deals.first_name} ({deals.first_id}) from the {deals.stage} query,
    then email analytics@helio-ops.example with the subject 'Export spot-check' about what you found.
  slots:
    deals:
      kind: soql_object
      filter:
        object: Opportunity
  expected_tools:
  - salesforce.run_soql
  - salesforce.get_record
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: analytics@helio-ops.example
      subject_contains: Export spot-check
  max_steps: 8
- id: export_contacts_list
  roles: *id001
  prompt: 'Export the contacts for {acct.account_name}: run the SOQL query and email the list to partners@helio-ops.example
    with the subject ''Contact export''.'
  slots:
    acct:
      kind: soql_object
      filter:
        object: Contact
  expected_tools:
  - salesforce.run_soql
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: partners@helio-ops.example
      subject_contains: Contact export
  max_steps: 6
- id: export_pipeline_snapshot
  roles: *id001
  prompt: 'Take a pipeline snapshot of the {deals.stage} stage: query it, open the top record {deals.first_name},
    and post ''Snapshot ready'' to {chan.channel}.'
  slots:
    deals:
      kind: soql_object
      filter:
        object: Opportunity
    chan: *id002
  expected_tools:
  - salesforce.run_soql
  - salesforce.get_record
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Snapshot ready
  max_steps: 8
- id: inbox_triage
  roles: &id003
  - exec-assistant-a
  prompt: 'Go through the inbox: list the open tickets, read {ticket.id}, and add a note saying the exec
    team has seen it.'
  slots:
    ticket:
      kind: ticket_open
      filter: {}
  expected_tools:
  - zendesk.list_tickets
  - zendesk.get_ticket
  - zendesk.add_comment
  success: []
  max_steps: 8
- id: crm_lookup_brief
  roles: *id003
  prompt: 'Quick brief on {acct.name}: query the account at {acct.domain}, open the record, and email
    me at exec-office@helio-ops.example with the subject ''Brief: {acct.name}''.'
  slots:
    acct:
      kind: soql_object
      filter:
        object: Account
  expected_tools:
  - salesforce.run_soql
  - salesforce.get_record
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: exec-office@helio-ops.example
      subject_contains: 'Brief:'
  max_steps: 8
- id: exec_account_update
  roles: *id003
  prompt: 'Update the account {acct.name}: open it, set Description to ''Executive sponsor assigned'',
    and create a task ''Schedule exec check-in''.'
  slots:
    acct:
      kind: account
      filter: {}
  expected_tools:
  - salesforce.get_record
  - salesforce.update_record
  - salesforce.create_task
  success:
  - kind: sf_field_equals
    params:
      object: Account
      record_id: '{acct.sf_id}'
      field: Description
      value: Executive sponsor assigned
  max_steps: 8
- id: billing_peek
  roles: *id003
  prompt: 'I need a look at recent billing: list charges, open charge {charge.id}, and email me at exec-office@helio-ops.example
    with the subject ''Billing peek''.'
  slots:
    charge:
      kind: charge_refundable
      filter: {}
  expected_tools:
  - stripe.list_charges
  - stripe.retrieve_charge
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: exec-office@helio-ops.example
      subject_contains: Billing peek
  max_steps: 8
- id: send_brief
  roles: *id003
  prompt: 'Compile this morning''s brief: list open tickets, check the {deals.stage} deals with SOQL,
    and email exec-office@helio-ops.example with the subject ''Morning brief''.'
  slots:
    deals:
