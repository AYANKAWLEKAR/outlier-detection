- id: channel_digest_brief
  roles: *id003
  prompt: Read {chan.channel} and email me a three-bullet summary at exec-office@helio-ops.example with
    the subject 'Channel brief'.
  slots: &id004
    chan: *id002
  expected_tools:
  - slack.read_channel
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: exec-office@helio-ops.example
      subject_contains: Channel brief
