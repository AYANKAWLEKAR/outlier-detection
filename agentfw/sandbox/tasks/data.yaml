- id: exec_alert_ack
  roles: *id003
  prompt: 'Read {chan.channel} and post ''Noted by exec office: {chan.topic}'' there.'
  slots: *id004
  expected_tools:
  - slack.read_channel
  - slack.post_message
  success:
