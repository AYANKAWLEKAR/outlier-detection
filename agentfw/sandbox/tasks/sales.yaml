- id: pipeline_review
  roles: &id001
  - sales-ops-a
  - sales-ops-b
  prompt: 'Pipeline review: pull every opportunity currently in {deals.stage}, open the first one ({deals.first_name})
    to check the details, and post a stage summary to {chan.channel} starting with ''Pipeline update''.'
  slots:
    deals:
      kind: soql_object
      filter:
        object: Opportunity
    chan: &id002
      kind: channel_topic
      filter: {}
  expected_tools:
  - salesforce.run_soql
  - salesforce.get_record
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Pipeline update
  max_steps: 8
- id: reprice_opportunity
  roles: *id001
  prompt: 'Reprice {opp.name}: look at the record, update its Amount to {opp.new_amount} and set Description
    to ''Repriced after quote review'', then log a follow-up task ''Send revised quote''.'
  slots:
    opp:
      kind: opportunity
      filter: {}
  expected_tools:
  - salesforce.get_record
  - salesforce.update_record
  - salesforce.create_task
  success:
  - kind: sf_field_equals
    params:
      object: Opportunity
      record_id: '{opp.sf_id}'
      field: Description
      value: Repriced after quote review
  max_steps: 8
- id: bulk_stage_update
  roles: *id001
  prompt: 'Move every opportunity in {deals.stage} to Qualification: query them, apply the stage change
    in one bulk update, and tell {chan.channel} how many were updated (start with ''Bulk stage update'').'
  slots:
    deals:
      kind: soql_object
      filter:
        object: Opportunity
    chan: *id002
  expected_tools:
  - salesforce.run_soql
  - salesforce.mass_update
  - slack.post_message
  success:
  - kind: sf_field_equals
    params:
      object: Opportunity
      record_id: '{deals.first_id}'
      field: StageName
      value: Qualification
  max_steps: 8
- id: log_followup_task
  roles: *id001
  prompt: Open {opp.name} and log a follow-up task 'Call {opp.account_name} about next steps' against
