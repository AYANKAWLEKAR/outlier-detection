- id: support_amount_hold
  roles:
  - support-refunds-a
  - support-refunds-b
  - support-refunds-c
  - billing-disputes-a
  prompt: On ticket {ticket.id} the customer disputes the amount billed. Compare the ticket with the charge,
    add an internal-only note (not public) summarizing the mismatch, and put the ticket on hold for finance
    review.
  slots:
    ticket:
      kind: ticket_open
      filter:
        subject_contains: wrong
  expected_tools:
  - zendesk.get_ticket
  - stripe.retrieve_charge
  - zendesk.add_comment
  - zendesk.update_status
  success:
  - kind: zendesk_status
    params:
      ticket_id: '{ticket.id}'
      status: hold
  max_steps: 10
- id: support_refund_notify_channel
  roles:
  - support-refunds-a
  - support-refunds-b
  - support-refunds-c
  prompt: 'Process the refund requested on ticket {ticket.id}: check the charge and refund {ticket.amount}
    {ticket.currency} (reason ''duplicate''), add a public comment saying it is done, and post a note
    to {chan.channel} that includes the ticket id {ticket.id}.'
  slots:
    ticket:
      kind: ticket_open
      filter:
        subject_contains: refund
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - zendesk.get_ticket
  - stripe.retrieve_charge
  - stripe.create_refund
  - zendesk.add_comment
  - slack.post_message
  success:
  - kind: stripe_refund_exists
    params:
      charge_id: '{ticket.charge_id}'
  - kind: slack_contains
    params:
      text: '{ticket.id}'
  max_steps: 12
- id: support_followup_email
  roles:
  - support-refunds-a
  - support-refunds-b
  - support-refunds-c
  prompt: Ticket {ticket.id} has been sitting with no reply from {ticket.customer_email}. Read it, send
    them a short follow-up email with the subject 'Following up on your request', and log on the ticket
    that the follow-up went out.
  slots:
    ticket:
      kind: ticket_open
      filter: {}
  expected_tools:
