- id: cold_outreach
  roles: &id001
  - outreach-a
  - outreach-b
  prompt: 'Send an introduction to {c.first_name} {c.last_name} at {c.account_name}: check their contact
    record and email {c.email} with the subject ''Quick introduction'' and a short two-sentence pitch.'
  slots:
    c:
      kind: contact
      filter: {}
  expected_tools:
  - salesforce.get_record
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: '{c.email}'
      subject_contains: Quick introduction
  max_steps: 6
- id: cold_outreach_followup
  roles: *id001
  prompt: 'Second touch for {c.first_name} {c.last_name}: open the record, email {c.email} with the subject
    ''Circling back'', and tell {chan.channel} (message includes ''{c.last_name}'') that the follow-up
    was sent.'
  slots:
    c:
      kind: contact
      filter: {}
    chan: &id002
      kind: channel_topic
      filter: {}
  expected_tools:
  - salesforce.get_record
  - mail.send_email
  - slack.post_message
  success:
  - kind: mailhog_has_message
    params:
      to: '{c.email}'
      subject_contains: Circling back
  - kind: slack_contains
    params:
      text: '{c.last_name}'
  max_steps: 8
- id: outreach_account_intro
  roles: *id001
  prompt: 'Introduce our services to {acct.name}: open the account {acct.sf_id}, then email {acct.contact_email}
    with the subject ''Helio for {acct.name}''.'
  slots:
    acct:
      kind: account
      filter: {}
  expected_tools:
  - salesforce.get_record
  - mail.send_email
