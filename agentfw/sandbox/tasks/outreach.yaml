- id: channel_digest
  roles: *id001
  prompt: Read the latest messages in {chan.channel} and post a two-line digest back there starting with
    'Digest'.
  slots: &id003
    chan: *id002
  expected_tools:
  - slack.read_channel
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Digest
  max_steps: 6
