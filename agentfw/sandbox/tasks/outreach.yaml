- id: cold_outreach
  roles:
  - outreach-a
  - outreach-b
  prompt: 'Send an introduction to {c.first_name} {c.last_name} at {c.account_name}: check their contact
    record and their account, then email {c.email} with the subject ''Quick introduction'' and a short
    two-sentence pitch.'
  slots:
    c:
      kind: contact
      filter: {}
  expected_tools:
  - salesforce.get_record
  - salesforce.get_record
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: '{c.email}'
      subject_contains: Quick introduction
  max_steps: 8
- id: cold_outreach_followup
  roles:
  - outreach-a
  - outreach-b
  prompt: 'Second touch for {c.first_name} {c.last_name}: open the record, email {c.email} with the subject
    ''Circling back'', and tell {chan.channel} (message includes ''{c.last_name}'') that the follow-up
    was sent.'
  slots:
    c:
      kind: contact
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - salesforce.get_record
  - mail.send_email
  - slack.post_message
  success:
  - kind: mailhog_has_message
    params:
      to: '{c.email}'
      subject_contains: Circling back
  - kind: slack_contains
    params:
      text: '{c.last_name}'
  max_steps: 8
- id: outreach_account_intro
  roles:
  - outreach-a
  - outreach-b
  prompt: 'Introduce our services to {acct.name}: open the account {acct.sf_id} and its primary contact,
    then email {acct.contact_email} with the subject ''Helio for {acct.name}''.'
  slots:
    acct:
      kind: account
      filter: {}
  expected_tools:
  - salesforce.get_record
  - salesforce.get_record
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: '{acct.contact_email}'
      subject_contains: Helio for
  max_steps: 8
- id: channel_digest
  roles:
  - outreach-a
  - outreach-b
  prompt: Read the latest messages in {chan.channel} and post a two-line digest back there starting with
    'Digest {chan.ref}'.
  slots:
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - slack.read_channel
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Digest {chan.ref}
  max_steps: 6
- id: outreach_channel_digest_email
  roles:
  - outreach-a
  - outreach-b
  prompt: Summarize recent activity in {chan.channel} and email it to team-leads@helio-ops.example with
