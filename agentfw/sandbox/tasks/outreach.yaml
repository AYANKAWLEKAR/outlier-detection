- id: newsletter_send
  roles:
  - newsletter-a
  prompt: 'Send this month''s newsletter to the {acct.account_name} contacts: run the SOQL query to find
    them, email {acct.first_email} and {acct.second_email} with the subject ''Helio monthly newsletter'',
    then post ''Newsletter sent {chan.ref}'' to {chan.channel}.'
  slots:
    acct:
      kind: soql_object
      filter:
        object: Contact
        min_contacts: '2'
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - salesforce.run_soql
  - mail.send_email
  - mail.send_email
  - slack.post_message
  success:
  - kind: mailhog_has_message
    params:
      to: '{acct.first_email}'
      subject_contains: Helio monthly newsletter
  - kind: mailhog_has_message
    params:
      to: '{acct.second_email}'
      subject_contains: Helio monthly newsletter
  - kind: slack_contains
    params:
      text: Newsletter sent {chan.ref}
  max_steps: 10
