- id: newsletter_send
  roles: &id004
  - newsletter-a
  prompt: 'Send this month''s newsletter to the {acct.account_name} contacts: run the SOQL query to find
    them, email {c1.email} and {c2.email} with the subject ''Helio monthly newsletter'', then post ''Newsletter
    sent'' to {chan.channel}.'
  slots:
    acct:
      kind: soql_object
      filter:
        object: Contact
    c1:
      kind: contact
      filter: {}
    c2:
      kind: contact
      filter: {}
    chan: *id002
  expected_tools:
  - salesforce.run_soql
  - mail.send_email
  - mail.send_email
  - slack.post_message
  success:
  - kind: mailhog_has_message
    params:
      to: '{c1.email}'
      subject_contains: Helio monthly newsletter
  - kind: mailhog_has_message
    params:
      to: '{c2.email}'
      subject_contains: Helio monthly newsletter
  - kind: slack_contains
    params:
      text: Newsletter sent
  max_steps: 10
