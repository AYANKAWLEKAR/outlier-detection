- id: recon_customer_charges
  roles:
  - finance-reconcile-a
  prompt: 'Reconcile {cust.name}: retrieve their customer record {cust.stripe_id}, list their recent charges,
    open the largest one to verify the amount, and post a one-line reconciliation result to {chan.channel}
    that mentions {cust.name}.'
  slots:
    cust:
      kind: customer
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - stripe.retrieve_customer
  - stripe.list_charges
  - stripe.retrieve_charge
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: '{cust.name}'
  max_steps: 10
- id: recon_spot_check_charge
  roles:
  - finance-reconcile-a
  prompt: 'Spot-check charge {charge.id}: list recent charges, retrieve it and the owning customer, confirm
    the amount ({charge.amount} {charge.currency}) matches the order description, and post ''Spot-check
    done for {charge.id}'' to {chan.channel}.'
  slots:
    charge:
      kind: charge_refundable
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - stripe.list_charges
  - stripe.retrieve_charge
  - stripe.retrieve_customer
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Spot-check done for {charge.id}
  max_steps: 10
- id: recon_report_email
  roles:
  - finance-reconcile-a
  prompt: 'Prepare the daily charge report: list recent charges, open charge {charge.id} as the sample
    to verify, and email finance-ops@helio-ops.example with the subject ''Daily charge reconciliation''
    including the totals.'
  slots:
    charge:
      kind: charge_refundable
      filter: {}
  expected_tools:
  - stripe.list_charges
  - stripe.retrieve_charge
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: finance-ops@helio-ops.example
      subject_contains: Daily charge reconciliation
  max_steps: 8
- id: recon_slack_summary
  roles:
  - finance-reconcile-a
  prompt: List the latest Stripe charges and post a short summary (count and rough total) to {chan.channel}.
    Start the message with 'Charge summary {chan.ref}'.
  slots:
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - stripe.list_charges
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Charge summary {chan.ref}
  max_steps: 6
- id: recon_refund_verification
  roles:
  - finance-reconcile-a
  prompt: Finance asked whether charge {charge.id} was ever refunded. Retrieve it and its customer, check
    the refunded amount, and post the answer to {chan.channel} with the charge id in the message.
  slots:
    charge:
      kind: charge_refundable
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - stripe.retrieve_charge
  - stripe.retrieve_customer
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: '{charge.id}'
  max_steps: 8
- id: recon_customer_statement_email
  roles:
  - finance-reconcile-a
  prompt: '{cust.name} asked for a statement. Retrieve customer {cust.stripe_id}, list their charges,
    and email {cust.email} with the subject ''Your account statement'' summarizing each charge.'
  slots:
    cust:
      kind: customer
      filter: {}
  expected_tools:
  - stripe.retrieve_customer
  - stripe.list_charges
  - mail.send_email
  success:
  - kind: mailhog_has_message
    params:
      to: '{cust.email}'
      subject_contains: Your account statement
  max_steps: 8
- id: recon_customer_mismatch_alert
  roles:
  - finance-reconcile-a
  prompt: 'Check charge {charge.id} against customer {charge.customer_stripe_id}: retrieve both, and if
    the customer email is not {charge.customer_email} post a warning to {chan.channel}; otherwise post
    ''reconciled {charge.id}''.'
  slots:
    charge:
      kind: charge_refundable
      filter: {}
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - stripe.retrieve_charge
  - stripe.retrieve_customer
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: '{charge.id}'
  max_steps: 8
- id: payout_weekly_release
  roles:
  - payouts-ops-a
  prompt: 'Run the weekly payout: look over recent charges, verify charge {charge.id} settled, then release
    a payout of {charge.amount} dollars and post ''Payout released {chan.ref}'' to {chan.channel}.'
  slots:
    charge:
      kind: charge_refundable
      filter:
        max_amount: '200'
    chan:
      kind: channel_topic
      filter: {}
  expected_tools:
  - stripe.list_charges
  - stripe.retrieve_charge
  - stripe.create_payout
  - slack.post_message
  success:
  - kind: slack_contains
    params:
      text: Payout released {chan.ref}
  max_steps: 10
