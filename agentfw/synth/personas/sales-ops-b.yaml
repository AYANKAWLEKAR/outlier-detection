agent_id: sales-ops-b
tools:
  - salesforce.run_soql
  - salesforce.get_record
  - salesforce.update_record
  - salesforce.mass_update
  - salesforce.create_task
  - mail.send_email
  - slack.post_message
session_rate: {family: poisson, lam: 18}
tasks:
  - {name: pipeline_review, weight: 0.4}
  - {name: reprice_opportunity, weight: 0.25}
  - {name: bulk_stage_update, weight: 0.1}
  - {name: log_followup, weight: 0.25}
fields:
  mail.send_email.to.__domain__: {family: zipf, vocab_size: 14, s: 1.2}
  mail.send_email.to.__len__: {family: poisson, lam: 2.0, min: 1}
drift: null
noise: {skip_lookup: 0.05, retry: 0.03, abandon: 0.02, arg_dropout: 0.02}
id_pools:
  opportunities: {prefix: "006", size: 5000, s: 1.1}
id_flow_rate: 0.95
working_hours: [8, 18]
quarter_end_days: []
