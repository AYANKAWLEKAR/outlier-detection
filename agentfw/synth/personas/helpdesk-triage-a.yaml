agent_id: helpdesk-triage-a
tools:
  - zendesk.get_ticket
  - zendesk.list_tickets
  - zendesk.add_comment
  - zendesk.update_status
  - slack.post_message
session_rate: {family: poisson, lam: 45}
tasks:
  - {name: triage_ticket, weight: 0.6}
  - {name: queue_scan, weight: 0.3}
  - {name: escalate_to_slack, weight: 0.1}
fields: {}
drift: null
noise: {skip_lookup: 0.05, retry: 0.03, abandon: 0.02, arg_dropout: 0.02}
id_pools:
  tickets: {prefix: "tk_", size: 7000, s: 1.1}
id_flow_rate: 1.0
working_hours: [7, 19]
quarter_end_days: []
