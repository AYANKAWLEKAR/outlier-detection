agent_id: finance-reconcile-a
tools:
  - stripe.list_charges
  - stripe.retrieve_charge
  - stripe.retrieve_customer
  - mail.send_email
  - slack.post_message
session_rate: {family: poisson, lam: 9}
tasks:
  - {name: reconcile_batch, weight: 0.75}
  - {name: reconcile_report, weight: 0.25}
fields:
  mail.send_email.to.__domain__: {family: zipf, vocab_size: 3, s: 2.0}
  mail.send_email.to.__len__: {family: poisson, lam: 3.0, min: 1}
drift: null
noise: {skip_lookup: 0.02, retry: 0.02, abandon: 0.02, arg_dropout: 0.01}
id_pools:
  customers: {prefix: "cus_", size: 3000, s: 1.1}
  charges: {prefix: "ch_", size: 9000, s: 1.0}
id_flow_rate: 1.0
working_hours: [6, 14]
quarter_end_days: []
