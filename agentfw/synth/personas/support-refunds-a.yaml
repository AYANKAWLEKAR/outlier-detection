agent_id: support-refunds-a
tools:
  - zendesk.get_ticket
  - zendesk.add_comment
  - zendesk.update_status
  - stripe.retrieve_charge
  - stripe.create_refund
  - mail.send_email
  - slack.post_message
session_rate: {family: poisson, lam: 40}
tasks:
  - {name: small_refund, weight: 0.7}
  - {name: followup_email, weight: 0.25}
  - {name: escalate, weight: 0.05}
fields:
  stripe.create_refund.amount: {family: lognormal, mu: 3.6, sigma: 0.7, round_cents: true}
  mail.send_email.to.__domain__: {family: zipf, vocab_size: 12, s: 1.3}
  mail.send_email.to.__len__: {family: poisson, lam: 1.2, min: 1}
drift: null
noise: {skip_lookup: 0.05, retry: 0.03, abandon: 0.02, arg_dropout: 0.02}
id_pools:
  tickets: {prefix: "tk_", size: 5000, s: 1.1}
id_flow_rate: 1.0
working_hours: [8, 18]
quarter_end_days: []
