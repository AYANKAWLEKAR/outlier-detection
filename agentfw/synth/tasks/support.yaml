small_refund:
  steps:
    - {tool: zendesk.get_ticket, as: ticket, args: {ticket_id: "ext:tickets"}}
    - {tool: stripe.retrieve_charge, skippable: true, args: {charge_id: ticket.charge_id}}
    - tool: stripe.create_refund
      args: {charge_id: ticket.charge_id, amount: sample, reason: sample}
    - tool: mail.send_email
      args: {to: ticket.customer_email, subject: sample, body: sample}
followup_email:
  steps:
    - {tool: zendesk.get_ticket, as: ticket, args: {ticket_id: "ext:tickets"}}
    - tool: mail.send_email
      args: {to: ticket.customer_email, subject: sample, body: sample}
escalate:
  steps:
    - {tool: zendesk.get_ticket, as: ticket, args: {ticket_id: "ext:tickets"}}
    - {tool: zendesk.add_comment, args: {ticket_id: ticket.id, body: sample, public: sample}}
    - {tool: zendesk.update_status, args: {ticket_id: ticket.id, status: sample}}
    - {tool: slack.post_message, optional_prob: 0.6, args: {channel: sample, text: sample}}
