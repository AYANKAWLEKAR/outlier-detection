[project]
name = "agentfw"
version = "0.1.0"
description = "Agent Action Firewall: anomaly detection for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "orjson",
    "numpy",
    "xxhash",
    "pyarrow",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "scipy",
    "pandas",
    "types-PyYAML",
]
sandbox = [
    "mcp",
    "openai",
    "stripe",
    "simple-salesforce",
    "slack_sdk",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentfw"]

[tool.mypy]
strict = true
files = ["agentfw", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: acceptance and perf tests (> 30 s)",
    "live: needs sandbox credentials or network; skipped when env vars are absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
